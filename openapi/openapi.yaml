openapi: 3.1.0
info:
  title: Enterprise Export Platform API
  version: 0.1.0
  description: Initial contract for organization-scoped products, parties, and sales orders. This API contract is a proposal and does not imply production availability or regulatory compliance.
servers:
  - url: http://localhost:8080
    description: Local development only
tags:
  - name: Health
  - name: Products
  - name: Parties
  - name: Orders
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Return service health
      responses:
        '200':
          description: Service is responding
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/v1/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List products in the authenticated organization
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 256 }
      responses:
        '200':
          description: Product page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/parties:
    get:
      tags: [Parties]
      operationId: listParties
      summary: List customers and suppliers in the authenticated organization
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: kind
          schema: { type: string, enum: [customer, supplier, both] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Party page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List orders in the authenticated organization
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, submitted, approved, rejected, cancelled, fulfilled]
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Order page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create a draft order
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: Draft order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Idempotency conflict or invalid state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Caller is not authorized for this organization or action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message, correlationId]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string, format: uuid }
    Product:
      type: object
      required: [id, sku, name, unitOfMeasure, active]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        unitOfMeasure: { type: string }
        active: { type: boolean }
    Party:
      type: object
      required: [id, kind, legalName, active]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [customer, supplier, both] }
        legalName: { type: string }
        countryCode: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
        active: { type: boolean }
    OrderLineInput:
      type: object
      required: [productId, quantity, unitPrice, currency]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: 0 }
        unitPrice: { type: number, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    CreateOrder:
      type: object
      required: [customerPartyId, currency, lines]
      properties:
        customerPartyId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        notes: { type: [string, 'null'], maxLength: 2000 }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/OrderLineInput' }
    Order:
      type: object
      required: [id, status, currency, lines]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [draft, submitted, approved, rejected, cancelled, fulfilled] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        lines:
          type: array
          items:
            type: object
            required: [productId, quantity, unitPrice]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: number, exclusiveMinimum: 0 }
              unitPrice: { type: number, minimum: 0 }
    ProductPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        nextCursor: { type: [string, 'null'] }
    PartyPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Party' } }
        nextCursor: { type: [string, 'null'] }
    OrderPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        nextCursor: { type: [string, 'null'] }
